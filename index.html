<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<title>Lavadero · OrbePy v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEEFF2; --navy:#0E0E10; --blue:#9C7414; --card:#FFFFFF; --ink:#16181D; --ink2:#5A5F6B; --ink3:#8C909A; --line:#D5DADF;
  --sun:#E3B341; --sun-d:#C99A2E; --sun-ink:#1A1405;
  --merco:#003DA5;
  --wait:#7D8290; --wash:#1E63C8; --wash-bg:#E2ECFA; --ready:#1E8A4C; --ready-bg:#E3F4EA;
  --danger:#C2362B; --danger-bg:#FBE9E7; --wa:#1DA851;
  --r:10px; --sh:0 1px 0 rgba(22,24,29,.06),0 2px 8px rgba(22,24,29,.06);
  --fh:'Barlow Condensed',system-ui,sans-serif; --fb:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.h1{font-family:var(--fh);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0 0 20px}
.h2{font-family:var(--fh);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px}
.muted{color:var(--ink2)} .small{font-size:13px}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 120px}
.narrow{max-width:720px}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;min-width:0;margin-right:auto}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--sun);color:var(--ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--fh);font-size:21px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:#BDB8AC;line-height:1}
.top nav{display:flex;gap:6px}
.tb{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:0;background:transparent;color:#DAD6CC;padding:8px 10px;border-radius:8px;font-weight:600;font-size:15px}
.tb:hover{background:#24242A;color:#fff}
.tb.on{background:#2E2E35;color:#fff;box-shadow:inset 0 -2px 0 var(--sun)}
.tb.sun{background:var(--sun);color:var(--sun-ink)}
.tb.sun:hover{background:var(--sun-d)}
.lb-s{display:none}
.hlogo{height:42px;width:auto;border-radius:6px;flex:none;display:block}
.brand b.with-logo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand b.with-logo + small{font-size:13px;color:#DAD6CC}
.hero-logo{display:block;width:100%;border-radius:14px;margin:0 0 24px;box-shadow:0 0 0 1px #2A2A30,0 20px 40px rgba(0,0,0,.5)}
.hero-logo.sm{width:auto;max-width:100%;height:120px;object-fit:cover;margin:0 auto 18px}
.pick-logo{height:40px;width:auto;border-radius:6px;flex:none}
.logo-prev{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.logo-prev img{height:64px;border-radius:8px;background:#0E0E10}
@media(max-width:640px){.tb .lb{display:none}.tb.sun .lb-s{display:inline}.tb{padding:8px}.top{gap:6px;padding-left:12px;padding-right:12px}.brand small{display:none}.brand b{font-size:18px}.demo-chip{display:none}}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:9px;font-weight:700;font-size:15px;min-height:44px;transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px)}
.btn:hover{background:#F3F5F7}
.btn-sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)} .btn-sun:hover{background:var(--sun-d)}
.btn-ink{background:var(--navy);border-color:var(--navy);color:#fff} .btn-ink:hover{background:#2E2E35}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff} .btn-wa:hover{background:#178C43}
.btn-danger{border-color:var(--danger);color:var(--danger)} .btn-danger:hover{background:var(--danger-bg)}
.btn-ghost{border-color:transparent;background:transparent} .btn-ghost:hover{background:rgba(22,24,29,.06)}
.btn-lg{min-height:54px;font-size:17px;padding:12px 22px}
.btn-sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}

/* chapa estilo Mercosur */
.plate{display:inline-flex;flex-direction:column;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;line-height:1;flex:none}
.plate::before{content:'PARAGUAY';background:var(--merco);color:#fff;font:700 7px/1 var(--fb);letter-spacing:.2em;text-align:center;padding:2px 6px}
.plate b{font-family:var(--fh);font-weight:700;font-size:20px;letter-spacing:.08em;padding:2px 8px 3px;color:var(--ink)}
.plate.sm b{font-size:16px;padding:1px 6px 2px}

/* formulario */
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.in{width:100%;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:11px 12px;min-height:46px;font-size:16px;outline:none;transition:border-color .15s}
.in::placeholder{color:#8C909A}
.in:focus{border-color:var(--ink)}
textarea.in{min-height:96px;resize:vertical}
.in-chapa{font-family:var(--fh);font-size:34px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center;border-width:2px;border-color:var(--ink);padding:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.fs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.fs > .h2{margin-bottom:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:10px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.seg-big button{min-height:60px;font-size:16px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:12px;font-weight:600;min-height:56px}
.chip small{font-weight:500;color:var(--ink2)}
.chip.on{border-color:var(--ink);background:var(--sun);box-shadow:inset 0 0 0 1px var(--ink)}
.chip.on small{color:var(--sun-ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.known{margin-top:10px;font-size:14px;border-radius:8px}
.known:not(:empty){padding:10px 12px;background:#E3EEFC;color:#0A3C8A}
.known.warn{background:var(--danger-bg);color:var(--danger)}
.sticky-total{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;margin-top:8px;box-shadow:0 -6px 20px rgba(22,24,29,.15)}
.sticky-total small{display:block;color:#BDB8AC;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.sticky-total b{font-family:var(--fh);font-size:30px;letter-spacing:.02em}

/* tablero */
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.board-head .h1{margin:0}
.counts{display:flex;gap:16px;font-size:14px;color:var(--ink2)}
.counts b{font-family:var(--fh);font-size:24px;color:var(--ink);display:block;line-height:1}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.col{background:#E4E9F0;border-radius:12px;padding:10px;min-height:120px;border-top:4px solid var(--wait)}
.col.c-lavando{background:#E1EAF7;border-top-color:var(--wash)}
.col.c-listo{background:#DDF0E4;border-top-color:var(--ready)}
.recent{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:var(--ink2)}
.recent button{border:0;background:none;padding:0;cursor:pointer}
.col-h{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em;padding:4px 6px 10px}
.col-h .dot{width:10px;height:10px;border-radius:50%}
.col-h .n{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0 9px;font-size:16px}
.empty{color:var(--ink3);font-size:14px;padding:18px 8px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--wait);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;animation:pop .25s ease}
.card.st-lavando{border-left-color:var(--wash)} .card.st-listo{border-left-color:var(--ready)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .num{font-family:var(--fh);font-size:16px;color:var(--ink3)}
.card .veh{margin-top:8px;font-weight:700}
.card .veh small{font-weight:500;color:var(--ink2)}
.card .cli{font-size:14px;color:var(--ink2)}
.card .servs{font-size:14px;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:#E6EAED;color:var(--ink2)}
.tag.deliv{background:#E8EEFB;color:var(--merco)}
.tag.paid{background:var(--ready-bg);color:var(--ready)}
.tag.unpaid{background:#FFF4D1;color:#7A5B00}
.tag.sent{background:var(--ready-bg);color:var(--ready)}
.tag.late{background:var(--danger-bg);color:var(--danger)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap}
.card-foot b{font-family:var(--fh);font-size:22px}
.card-foot .acts{display:flex;gap:6px;flex-wrap:wrap}
.done-list{margin-top:22px}
.done-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:6px;font-size:14px;cursor:pointer}
.done-row .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--navy);color:#fff}
.login-box{width:100%;max-width:440px}
.login .h1{color:#fff}
.login .lead{color:#BDB8AC;margin:-8px 0 24px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#1A1A1F;border:1px solid #34343C;color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;font-weight:700;font-size:17px}
.pick:hover{border-color:var(--sun)}
.pick small{display:block;font-weight:500;color:#A39F94;font-size:13px}
.pick .st{margin-left:auto}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:20px}
.names button{background:#1A1A1F;border:1.5px solid #34343C;color:#fff;border-radius:10px;padding:14px 8px;font-weight:700;font-size:16px}
.names button.on{border-color:var(--sun);background:#3A3520}
.names small{display:block;font-weight:500;font-size:12px;color:#A39F94}
.dots{display:flex;justify-content:center;gap:14px;margin:8px 0 18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #6E6A62}
.dots i.f{background:var(--sun);border-color:var(--sun)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:62px;border-radius:12px;border:0;background:#1A1A1F;color:#fff;font-family:var(--fh);font-size:28px;font-weight:700}
.keys button:active{background:#34343C}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.linkbtn{background:none;border:0;color:#A39F94;text-decoration:underline;padding:8px 0;font-size:14px}
.demo-note{margin-top:28px;font-size:13px;color:#8C909A;border-top:1px solid #2E2E35;padding-top:14px}

/* admin */
.adm{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:70px;display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;font-weight:600;color:var(--ink2)}
.side button:hover{background:rgba(22,24,29,.05);color:var(--ink)}
.side button.on{background:var(--navy);color:#fff}
@media(max-width:820px){.adm{grid-template-columns:1fr}.side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}.side button{white-space:nowrap}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi small{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.kpi b{display:block;font-family:var(--fh);font-size:30px;line-height:1.1;margin-top:4px}
.kpi.hl{background:var(--sun);border-color:var(--sun)} .kpi.hl small{color:var(--sun-ink)}
.kpi.bad b{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.bars .br{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr auto;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bars .tr{height:10px;background:#E6EAED;border-radius:6px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--blue);border-radius:6px}
.bars .v{font-weight:700;white-space:nowrap;text-align:right}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .in{max-width:340px}
.toolbar .grow{flex:1}
.searchbox{position:relative;flex:1;min-width:240px;max-width:360px}
@media(max-width:640px){.searchbox{max-width:none;flex-basis:100%}}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.searchbox .in{padding-left:40px;max-width:none}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);background:#F4F6F7;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid #E8ECEF;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#F7F9FA}
.tbl .r{text-align:right;white-space:nowrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-espera{background:#ECEDF0;color:var(--wait)} .p-lavando{background:var(--wash-bg);color:var(--wash)}
.p-listo{background:var(--ready-bg);color:var(--ready)} .p-entregado{background:#E6EAED;color:var(--ink2)}
.p-cancelado{background:var(--danger-bg);color:var(--danger)}
.p-activo{background:var(--ready-bg);color:var(--ready)} .p-suspendido{background:var(--danger-bg);color:var(--danger)}
.p-vencido{background:#FFF4D1;color:#7A5B00}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:15px}
.banner.ok{background:#E3E8EB}
.banner.warn{background:#FFF4D1;color:#5C4400}
.banner.bad{background:var(--danger-bg);color:var(--danger)}
.hint{font-size:13px;color:var(--ink2);margin-top:6px}
.hint code{background:#E6EAED;padding:1px 5px;border-radius:4px;font-size:12px}

/* lavaderos (super) */
.lav{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.lav.susp{background:#FBF4F3;border-color:#EBCFCB}
.lav b{font-size:17px}
.lav .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:820px){.lav{grid-template-columns:1fr 1fr}.lav .acts{grid-column:1/-1;justify-content:flex-start}}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(16,18,22,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:640px){.ov{align-items:center;padding:24px}}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease}
@media(min-width:640px){.sheet{border-radius:16px}}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h .h2{margin:0;font-size:24px}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sheet .acts .btn{flex:1}
.big-total{font-family:var(--fh);font-size:48px;font-weight:800;text-align:center;margin:4px 0 2px}
.tl{list-style:none;padding:0;margin:10px 0 0;font-size:14px}
.tl li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.wa-prev{background:#DCF8C6;border-radius:10px 10px 10px 2px;padding:12px;font-size:15px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:8px 0}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:600}

.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s}
.demo-chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#2E2E35;color:var(--sun);padding:3px 7px;border-radius:5px}
@media(max-width:640px){.demo-chip{display:none}}
body.ocupado .btn,body.ocupado .chip{opacity:.6;pointer-events:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* =========================================================
   Lavadero · OrbePy — v3
   Nube: Supabase "orbe-clientes" (la misma base del pádel y del panel).
   Cada lavadero es un cliente del panel (clubs.app = 'lavadero') y entra con
   ?club=<id>. Dispositivo activado con el código del cliente, personas con PIN,
   toda escritura por funciones del servidor (lav_*). Ver supabase/012_lavadero.sql.
   ?demo = demostración local, no toca la nube.
   ========================================================= */
const VERSION = 'v3';
const NUBE_CFG = { url: 'https://oishkxlodwxfaskodafo.supabase.co', key: 'sb_publishable_apIt6AE-7gax1X6QWjdVZQ_QtAIoOhM' };
const PARAMS = new URLSearchParams(location.search);
const MODO_DEMO = PARAMS.has('demo');
const CLUB = (PARAMS.get('club') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
const DEMO_KEY = 'lav.demo.v3';
const OP_KEY = 'lav.op.' + (MODO_DEMO ? 'demo' : CLUB);
const DAY = 864e5;

const $ = s => document.querySelector(s);

const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const ms = v => v ? (typeof v === 'number' ? v : Date.parse(v)) : null;
function ymd(t){ const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtF(s){ const d = typeof s === 'string' ? parseYmd(s) : new Date(s); return d.toLocaleDateString('es-PY',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtFH(t){ const d = new Date(t); return d.toLocaleDateString('es-PY',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'}); }
function fmtH(t){ return new Date(t).toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'}); }
function hace(t){ const m = Math.max(0, Math.floor((Date.now()-t)/60000)); if(m < 1) return 'recién'; if(m < 60) return m+' min'; const hh = Math.floor(m/60); if(hh < 24) return hh+' h '+(m%60)+' min'; return Math.floor(hh/24)+' días'; }
function hoy0(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function normChapa(s){ return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function waNum(tel){ let d = String(tel || '').replace(/\D/g, ''); if(!d) return ''; if(d.startsWith('595')) return d; if(d.startsWith('0')) d = d.slice(1); return '595' + d; }
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e){ return false; } };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch(e){ return null; } };
const ssSet = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch(e){} };

function logoActual(){
  if(S.config.logo) return {mark:S.config.logo, full:S.config.logo};

function subirLogo(input){
  const f = input.files && input.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)) return toast('Elegí una imagen');
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const w = Math.min(640, im.width), hh = Math.round(im.height * w / im.width);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = hh; cv.getContext('2d').drawImage(im, 0, 0, w, hh);
    let data = cv.toDataURL('image/webp', .85);
    if(!data.startsWith('data:image/webp')) data = cv.toDataURL('image/jpeg', .85);
    ACT.logo(data);
  }; im.onerror = () => toast('No se pudo leer la imagen'); im.src = rd.result; };
  rd.readAsDataURL(f);
}

    const servs = idx.map(i => s.servicios[i]).filter(x => x.precios[v.tipo]).map(x => ({id:x.id, nombre:x.nombre, precio:x.precios[v.tipo]}));
    const o = {id:uid(), num:++seq, vehiculoId:v.id, clienteId:v.clienteId, chapa:v.chapa, tipo:v.tipo, servicios:servs, total:sum(servs, x => x.precio),
      entrega:'retira', direccion:'', nota:'', estado, pagado:false, metodo:null, pagadoEn:null, recibio:'Carlos', lavador:'', cobro:'',
      creado, tiempos:{}, avisado:false, avisadoEn:null, avisoTipo:null, motivo:'', canceladoPor:'', canceladoEn:null, ...extra};
    if(estado !== 'espera'){ o.lavador = lav[o.num % 3]; o.tiempos.lavando = creado + 8*60000; }
    if(estado === 'listo' || estado === 'entregado') o.tiempos.listo = creado + 45*60000;
    if(estado === 'entregado'){ o.tiempos.entregado = creado + 60*60000; o.pagado = true; o.pagadoEn = o.tiempos.entregado; o.metodo = Object.keys(METODOS)[o.num % 4]; o.cobro = 'Carlos'; o.avisado = true; }
    s.ordenes.push(o);
  };
  for(let day = 14; day >= 1; day--){
    const base = hoy0() - day*DAY + 8*3600000, n = 3 + ((day * 7) % 5);
    for(let k = 0; k < n; k++) mk((day + k) % 8, [[0],[1],[1,2],[0,2],[3],[1,4]][(day + k) % 6], 'entregado', base + k*55*60000);
  }
  const t = hoy0() + 8*3600000;
  mk(5, [1,2], 'entregado', t); mk(7, [0], 'entregado', t + 30*60000); mk(4, [0], 'entregado', t + 50*60000);
  mk(1, [1,3], 'listo', now - 70*60000, {entrega:'delivery', direccion:'Las Mercedes, calle Tte. Vera 455'});
  mk(0, [0,2], 'lavando', now - 40*60000);
  mk(3, [1], 'lavando', now - 25*60000, {pagado:true, metodo:'transferencia', pagadoEn:now - 25*60000, cobro:'Carlos'});
  mk(2, [0], 'espera', now - 12*60000);
  mk(6, [1,4], 'espera', now - 4*60000, {nota:'Tiene barro en la caja, avisar si hace falta lavado de chasis'});
  s.seq = seq;
  return s;
}

function msgError(e){
  const t = String((e && (e.message || e.details)) || e || '');
  for(const k in ERRORES) if(t.includes(k)) return ERRORES[k];
  if(e && e.code === '23505') return t.includes('pin') ? 'Ese PIN ya lo usa otra persona.' : 'Esa chapa ya está en el local.';
  if(/fetch|network|Failed/i.test(t)) return 'Sin conexión. Revisá internet y probá de nuevo.';
  return 'No se pudo guardar: ' + t.slice(0, 120);
}

const nube = {
  estado:'cargando', err:'', ocupado:false, pendiente:new Set(), timer:null,

  async iniciar(){

  },
  async cargarVehiculos(){
    const r = await todo(() => sb.from('lav_vehiculos').select('id,chapa,tipo,marca,color,cliente_id').eq('club_id', this.C).order('creado'));

  async cargarOrdenes(){
    const desde = new Date(hoy0() - 60*DAY).toISOString();
    const r = await todo(() => sb.from('lav_ordenes').select('*').eq('club_id', this.C).or('creado.gte.' + desde + ',estado.in.(espera,lavando,listo)').order('creado'));
    S.ordenes = r.map(o => ({ id:o.id, num:o.num, vehiculoId:o.vehiculo_id, clienteId:o.cliente_id, chapa:o.chapa, tipo:o.tipo,

      pagado:o.pagado, metodo:o.metodo, pagadoEn:ms(o.pagado_ts), recibio:o.recibio, lavador:o.lavador, cobro:o.cobro, creado:ms(o.creado),
      tiempos:{ lavando:ms(o.t_lavando), listo:ms(o.t_listo), entregado:ms(o.t_entregado) },
      avisado:o.avisado, avisadoEn:ms(o.avisado_ts), avisoTipo:o.aviso_tipo, motivo:o.motivo, canceladoPor:o.cancelado_por, canceladoEn:ms(o.cancelado_ts) }));

  escuchar(){
    if(this.canal) return;
    const MAPA = { lav_ordenes:'Ordenes', lav_servicios:'Servicios', lav_config:'Club', lav_clientes:'Clientes', lav_vehiculos:'Vehiculos' };
    const ch = sb.channel('lav-' + this.C);
    Object.keys(MAPA).forEach(t => ch.on('postgres_changes', { event:'*', schema:'public', table:t, filter:'club_id=eq.' + this.C }, () => this.programar(MAPA[t])));
    ch.on('postgres_changes', { event:'*', schema:'public', table:'clubs', filter:'id=eq.' + this.C }, () => { this.programar('Club'); this.revisarServicio(); });
    ch.subscribe();
    this.canal = ch;
  },
  programar(k){
    this.pendiente.add(k); clearTimeout(this.timer);

      try { await Promise.all(ks.map(x => this['cargar' + x]())); } catch(e){} renderSeguro(); }, 400);
  },
  async hacer(fn, recargar, ok){
    if(this.ocupado) return false;
    this.ocupado = true; document.body.classList.add('ocupado');
    try {
      const r = await fn();
      if(recargar && recargar.length) await Promise.all(recargar.map(k => this['cargar' + k]()));
      if(ok) toast(typeof ok === 'function' ? ok(r) : ok);
      return r == null ? true : r;   // las funciones que no devuelven nada llegan como null
    } catch(e){
      toast(msgError(e));
      if(String(e && e.message).includes('SESION_VENCIDA')){ guardarOP(null); }
      if(String(e && e.message).includes('NO_AUTORIZADO')){ this.revisarServicio(); }
      return false;
    } finally { this.ocupado = false; document.body.classList.remove('ocupado'); }
  },
  rpc(nombre, args){ return q(sb.rpc(nombre, { p_club:this.C, p_token:OP.token, ...args })); }
};

  const app = $('#app');
  if(!S.demo && nube.estado !== 'ok') { app.innerHTML = viewGate(); return; }
  if(!S.demo && !S.empleados.some(e => e.activo)) { app.innerHTML = viewPrimerAdmin(); return; }
  if(!me()) { app.innerHTML = viewPin(); return; }
  if(ui.view === 'admin' && !esAdmin()) ui.view = 'tablero';
  if(ui.view === 'ingreso') { app.innerHTML = viewIngreso(); updIngreso(); setTimeout(() => $('#f-chapa') && !$('#f-chapa').value && $('#f-chapa').focus(), 50); return; }
  if(ui.view === 'admin') { app.innerHTML = viewAdmin(); afterAdmin(); return; }
  app.innerHTML = viewTablero();
}

function shell(content){

function avisoServicio(){
  const sv = S.servicio; if(!sv || sv.prueba || sv.dias == null) return '';

    return `<div class="wrap" style="padding-bottom:0"><div class="banner bad" style="margin:0"><span><b>La suscripción venció el ${fmtF(sv.vence)}.</b> ${quedan > 0 ? 'El sistema se suspende en ' + quedan + ' día' + (quedan === 1 ? '' : 's') + '.' : 'Se suspende hoy.'} Comunicate con OrbePy para regularizar.</span></div></div>`; }

  return '';
}

let pinBuf = '', pinTarget = null;
function viewPin(){
  const emps = S.empleados.filter(e => e.activo);
  return `<div class="login"><div class="login-box">
    ${marcaLogin()}
    <h1 class="h1">¿Quién sos?</h1>
    <div class="names">${emps.map(e => `<button class="${pinTarget && pinTarget.id === e.id ? 'on' : ''}" onclick="pinFor('${e.id}')">${h(e.nombre)}<small>${e.rol === 'admin' ? 'Administrador' : 'Empleado'}</small></button>`).join('')}</div>
    ${pinTarget ? keypad('Ingresá tu PIN') : ''}
    ${S.demo ? `<div class="demo-note">Demostración: los datos se guardan solo en este navegador.<br>PIN — JM 1234 (administrador) · Carlos 1111 · Mati 2222 · Rocío 3333</div>` : ''}
  </div></div>`;
}
function keypad(label){
  return `<p class="lead" style="margin:0 0 8px;text-align:center">${label}</p>
  <div class="dots" id="dots">${[0,1,2,3].map(i => `<i class="${i < pinBuf.length ? 'f' : ''}"></i>`).join('')}</div>
  <div class="keys">${['1','2','3','4','5','6','7','8','9'].map(k => `<button onclick="pk('${k}')">${k}</button>`).join('')}<button onclick="pk('del')" aria-label="Borrar">${ic('back', 24)}</button><button onclick="pk('0')">0</button><span></span></div>`;
}
function pinFor(id){ pinTarget = {id}; pinBuf = ''; render(); const k = $('.keys'); if(k) k.scrollIntoView({block:'end', behavior:'smooth'}); }
function pk(k){
  if(!pinTarget || pk.ocupado) return;
  if(k === 'del') pinBuf = pinBuf.slice(0, -1); else if(pinBuf.length < 4) pinBuf += k;
  const dots = $('#dots'); if(dots) dots.innerHTML = [0,1,2,3].map(i => `<i class="${i < pinBuf.length ? 'f' : ''}"></i>`).join('');
  if(pinBuf.length === 4) setTimeout(checkPin, 120);
}
async function checkPin(){
  const pin = pinBuf, id = pinTarget.id; let ok = null;
  pk.ocupado = true;
  try {
    if(S.demo){ const e = S.empleados.find(x => x.id === id && x.activo); if(e && e.pin === pin) ok = {id:e.id, nombre:e.nombre, rol:e.rol, token:null}; }
    else { const r = await q(sb.rpc('verificar_pin', { p_club:CLUB, p_operador:id, p_pin:pin })); const x = r && r[0]; if(x) ok = {id:x.id, nombre:x.nombre, rol:rolUI(x.rol), token:x.token}; }
  } catch(e){ toast(msgError(e)); }
  pk.ocupado = false; pinBuf = '';
  if(ok){ guardarOP(ok); pinTarget = null; ui.view = 'tablero'; render(); return; }
  const dots = $('#dots'); if(dots){ dots.classList.add('shake'); dots.innerHTML = '<i></i><i></i><i></i><i></i>'; setTimeout(() => dots.classList.remove('shake'), 400); }
  if(!$('#toast').innerHTML) toast('PIN incorrecto');
}
function logout(){
  if(!S.demo && OP && OP.token) sb.rpc('sesion_cerrar', { p_club:CLUB, p_token:OP.token }).then(() => {}, () => {});
  guardarOP(null); pinTarget = null; pinBuf = ''; ui.view = 'tablero'; render();

/* ---------- tablero (empleados) ---------- */
function viewTablero(){
  const d = D();
  const activas = d.ordenes.filter(o => ABIERTAS.includes(o.estado)).sort((a, b) => a.creado - b.creado);
  const entregadasHoy = d.ordenes.filter(o => o.estado === 'entregado' && (o.tiempos.entregado || 0) >= hoy0()).sort((a, b) => b.tiempos.entregado - a.tiempos.entregado);
  const cols = [['espera','En espera','var(--wait)'],['lavando','Lavando','var(--wash)'],['listo','Listos','var(--ready)']];
  return shell(`<main class="wrap">
    <div class="board-head"><h1 class="h1">Tablero de hoy</h1>
      <div class="counts"><div><b>${activas.length}</b>en el local</div><div><b>${entregadasHoy.length}</b>entregados</div><div><b>${gs(sum(d.ordenes.filter(o => o.pagado && o.estado !== 'cancelado' && o.pagadoEn >= hoy0()), o => o.total)).replace('Gs. ', '')}</b>cobrado (Gs.)</div></div></div>
    <div class="board">${cols.map(([k, t, c]) => { const list = activas.filter(o => o.estado === k); return `<section class="col c-${k}"><div class="col-h"><span class="dot" style="background:${c}"></span>${t}<span class="n">${list.length}</span></div>${list.length ? list.map(cardHTML).join('') : `<div class="empty">${k === 'espera' ? 'Sin autos esperando. Tocá “Nuevo ingreso” cuando llegue uno.' : k === 'lavando' ? 'Nadie lavando ahora.' : 'Ninguno listo todavía.'}</div>`}</section>`; }).join('')}</div>
    ${entregadasHoy.length ? `<div class="done-list"><h2 class="h2">Entregados hoy</h2>${entregadasHoy.map(o => { const c = cliById(o.clienteId); return `<div class="done-row" onclick="openOrden('${o.id}')"><span class="plate sm"><b>${h(o.chapa)}</b></span><span class="grow">${h(c ? c.nombre : 'Sin cliente')} · ${h(o.servicios.map(s => s.nombre).join(' + '))}</span><span class="muted small">${fmtH(o.tiempos.entregado)}</span><b>${gs(o.total)}</b></div>`; }).join('')}</div>` : ''}
  </main>`);
}
function cardHTML(o){
  const v = vehById(o.vehiculoId), c = cliById(o.clienteId), tipo = (v && v.tipo) || o.tipo || 'auto';
  const desde = o.estado === 'espera' ? o.creado : o.tiempos[o.estado] || o.creado;
  const min = (Date.now() - desde) / 60000;
  const late = (o.estado === 'espera' && min > 30) || (o.estado === 'listo' && min > 90);
  let acts = '';
  if(o.estado === 'espera') acts = `<button class="btn btn-ink btn-sm" onclick="event.stopPropagation();avanzar('${o.id}')">${ic('arrow', 16)} Empezar</button>`;
  if(o.estado === 'lavando') acts = `<button class="btn btn-ink btn-sm" onclick="event.stopPropagation();avanzar('${o.id}')">${ic('check', 16)} Está listo</button>`;
  if(o.estado === 'listo') acts = `<button class="btn ${o.avisado ? '' : 'btn-wa'} btn-sm" onclick="event.stopPropagation();openAviso('${o.id}')">${ic('wa', 16)} ${o.avisado ? 'Reenviar' : 'Avisar'}</button><button class="btn btn-sun btn-sm" onclick="event.stopPropagation();openCobro('${o.id}')">${ic('cash', 16)} ${o.pagado ? 'Entregar' : 'Cobrar'}</button>`;
  return `<article class="card st-${o.estado}" onclick="openOrden('${o.id}')">
    <div class="card-top"><span class="plate"><b>${h(o.chapa)}</b></span><span class="num">#${o.num}</span></div>
    <div class="veh">${h(vehDesc(v))} <small>· ${TIPOS[tipo]}</small></div>
    <div class="cli">${h(c ? c.nombre : 'Sin cliente')}</div>
    <div class="servs">${h(o.servicios.map(s => s.nombre).join(' + '))}</div>
    <div class="meta">
      <span class="tag ${late ? 'late' : ''}">${ic('clock', 13)} ${o.estado === 'listo' ? 'listo hace ' : ''}${hace(desde)}</span>
      ${o.entrega === 'delivery' ? `<span class="tag deliv">${ic('truck', 13)} Delivery</span>` : ''}
      ${o.pagado ? `<span class="tag paid">Pagado</span>` : ''}
      ${o.estado === 'listo' && o.avisado ? `<span class="tag sent">${ic('check', 13)} Avisado</span>` : ''}
      ${o.lavador ? `<span class="tag">${ic('user', 13)} ${h(o.lavador)}</span>` : ''}
    </div>
    <div class="card-foot"><b>${gs(o.total)}</b><div class="acts">${acts}</div></div>
  </article>`;
}

/* últimas chapas que vinieron y no están en el local: un toque y se completa todo */
function recientesHTML(){
  const d = D(), abiertas = new Set(d.ordenes.filter(o => ABIERTAS.includes(o.estado)).map(o => o.chapa)), vistas = [];
  d.ordenes.slice().sort((a, b) => b.creado - a.creado).forEach(o => { if(vistas.length < 6 && !abiertas.has(o.chapa) && !vistas.includes(o.chapa)) vistas.push(o.chapa); });
  return vistas.length ? `<div class="recent">Volvieron hace poco: ${vistas.map(c => `<button type="button" onclick="$('#f-chapa').value='${c}';fChapa('${c}')" title="Usar ${c}"><span class="plate sm"><b>${c}</b></span></button>`).join('')}</div>` : '';
}
function updIngreso(){
  const d = D();
  document.querySelectorAll('#f-tipo button').forEach(b => b.classList.toggle('on', b.dataset.v === form.tipo));
  document.querySelectorAll('#f-ent button').forEach(b => b.classList.toggle('on', b.dataset.v === form.entrega));
  $('#f-dir-wrap').hidden = form.entrega !== 'delivery';
  const servs = d.servicios.filter(s => s.activo);
  form.servicios = form.servicios.filter(id => { const s = servs.find(x => x.id === id); return s && s.precios[form.tipo]; });
  $('#f-servs').innerHTML = servs.map(s => { const p = s.precios[form.tipo]; const on = form.servicios.includes(s.id);
    return `<button type="button" class="chip ${on ? 'on' : ''}" ${p ? '' : 'disabled'} onclick="fServ('${s.id}')"><span>${h(s.nombre)}</span><small>${p ? gs(p) : 'No aplica'}</small></button>`; }).join('')
    || `<p class="muted">No hay servicios cargados. ${esAdmin() ? 'Cargalos en Administración → Servicios y precios.' : 'Pedile al administrador que los cargue.'}</p>`;
  $('#f-total').textContent = gs(sum(form.servicios, id => servs.find(s => s.id === id).precios[form.tipo]));
}
function fServ(id){ const i = form.servicios.indexOf(id); if(i >= 0) form.servicios.splice(i, 1); else form.servicios.push(id); updIngreso(); }
function fChapa(val){
  form.chapa = val; const ch = normChapa(val), d = D();
  const v = ch.length >= 4 ? d.vehiculos.find(x => x.chapa === ch) : null;
  const box = $('#f-known');
  if(v){
    if(form.vehiculoId !== v.id){
      const c = cliById(v.clienteId);
      Object.assign(form, {vehiculoId:v.id, tipo:v.tipo, marca:v.marca || '', color:v.color || ''});
      if(c) Object.assign(form, {clienteId:c.id, nombre:c.nombre, telefono:c.telefono || '', direccion:c.direccion || form.direccion});
      ['marca','color'].forEach(k => $('#f-' + k).value = form[k]);
      $('#f-tel').value = form.telefono; $('#f-nom').value = form.nombre; $('#f-dir').value = form.direccion;
      updIngreso();
    }
    const prev = d.ordenes.filter(o => o.chapa === ch && o.estado !== 'cancelado').sort((a, b) => b.creado - a.creado);
    const abierta = prev.find(o => ABIERTAS.includes(o.estado));
    box.className = 'known' + (abierta ? ' warn' : '');
    box.innerHTML = abierta ? `Este vehículo ya está en el local (orden #${abierta.num}, ${ESTADOS[abierta.estado].toLowerCase()}).`
      : `Cliente conocido${prev.length ? ` · <b>${prev.length}</b> visita${prev.length === 1 ? '' : 's'}${S.demo ? '' : ' en 60 días'} · la última hace ${hace(prev[0].creado)}: ${h(prev[0].servicios.map(s => s.nombre).join(' + '))}` : ''}`;
  } else {
    if(form.vehiculoId){ form.vehiculoId = null; form.clienteId = null; }
    box.className = 'known'; box.innerHTML = ch.length >= 4 ? 'Chapa nueva: completá los datos y queda guardada para la próxima.' : '';
  }
}
function fTel(){
  if(form.clienteId || !form.telefono.trim()) return;
  const c = D().clientes.find(x => waNum(x.telefono) === waNum(form.telefono));
  if(c){ form.clienteId = c.id; if(!form.nombre.trim()){ form.nombre = c.nombre; $('#f-nom').value = c.nombre; } toast('Cliente encontrado: ' + c.nombre); }
}
async function guardarIngreso(){
  const f = form, chapa = normChapa(f.chapa);
  if(chapa.length < 4) { toast('Falta la chapa'); $('#f-chapa').focus(); return; }
  if(!f.servicios.length) { toast('Elegí al menos un servicio'); return; }
  if(f.entrega === 'delivery' && !f.direccion.trim()) { toast('Falta la dirección de entrega'); $('#f-dir').focus(); return; }
  const abierta = D().ordenes.find(o => o.chapa === chapa && ABIERTAS.includes(o.estado));
  if(abierta) { toast('Esa chapa ya está en el local (orden #' + abierta.num + ')'); return; }
  const b = $('#f-ok'); if(b) b.disabled = true;
  const ok = await ACT.crearOrden(f);
  if(ok){ resetForm(); go('tablero'); } else if($('#f-ok')) $('#f-ok').disabled = false;
}

const ADM_TABS = [['resumen','chart','Resumen'],['ordenes','list','Órdenes'],['clientes','user','Clientes'],['servicios','tag','Servicios y precios'],['empleados','user','Personal y PIN'],['ajustes','admin','Ajustes y mensajes']];

function admResumen(){
  const d = D(), p = ui.per;
  const start = p === 'hoy' ? hoy0() : hoy0() - (p === '7' ? 6 : 29) * DAY;
  const ords = d.ordenes.filter(o => o.creado >= start && o.estado !== 'cancelado');
  const pagadas = d.ordenes.filter(o => o.pagado && o.pagadoEn >= start && o.estado !== 'cancelado');
  const cobrado = sum(pagadas, o => o.total);
  const pendiente = sum(d.ordenes.filter(o => !o.pagado && ABIERTAS.includes(o.estado)), o => o.total);
  const anuladas = d.ordenes.filter(o => o.estado === 'cancelado' && o.creado >= start);
  const bars = (rows, fmt = gs) => { const max = Math.max(1, ...rows.map(r => r[1])); return rows.length ? `<div class="bars">${rows.map(([k, v, extra]) => `<div class="br"><span>${h(k)}</span><span class="tr"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span><span class="v">${fmt(v)}${extra ? ' <span class="muted small">' + extra + '</span>' : ''}</span></div>`).join('')}</div>` : '<p class="muted">Sin datos en este período.</p>'; };
  const porMetodo = Object.keys(METODOS).map(k => [METODOS[k], sum(pagadas.filter(o => o.metodo === k), o => o.total)]).filter(r => r[1]);
  const servMap = {}; ords.forEach(o => o.servicios.forEach(s => { servMap[s.nombre] = servMap[s.nombre] || [0, 0]; servMap[s.nombre][0]++; servMap[s.nombre][1] += s.precio; }));
  const porServ = Object.entries(servMap).sort((a, b) => b[1][1] - a[1][1]).map(([k, [n, m]]) => [k, m, n + ' u.']);
  const empMap = {}; ords.filter(o => o.lavador).forEach(o => { empMap[o.lavador] = (empMap[o.lavador] || 0) + 1; });
  const porEmp = Object.entries(empMap).sort((a, b) => b[1] - a[1]);
  const dias = []; if(p !== 'hoy') for(let t = start; t <= hoy0(); t += DAY){ dias.push([new Date(t).toLocaleDateString('es-PY', {weekday:'short', day:'numeric'}), sum(pagadas.filter(o => o.pagadoEn >= t && o.pagadoEn < t + DAY), o => o.total)]); }
  return `<div class="board-head"><h1 class="h1">Resumen</h1>
    <div class="seg" style="min-width:300px">${[['hoy','Hoy'],['7','7 días'],['30','30 días']].map(([k, t]) => `<button class="${p === k ? 'on' : ''}" onclick="ui.per='${k}';render()">${t}</button>`).join('')}</div></div>
    <div class="kpis">
      <div class="kpi hl"><small>Cobrado</small><b>${gs(cobrado)}</b></div>
      <div class="kpi"><small>Vehículos</small><b>${ords.length}</b></div>
      <div class="kpi"><small>Ticket promedio</small><b>${gs(pagadas.length ? cobrado / pagadas.length : 0)}</b></div>
      <div class="kpi ${pendiente ? 'bad' : ''}"><small>Por cobrar en el local</small><b>${gs(pendiente)}</b></div>
    </div>
    ${p !== 'hoy' ? `<div class="panel"><h2 class="h2">Cobrado por día</h2>${bars(dias)}</div>` : ''}
    <div class="grid2">
      <div class="panel"><h2 class="h2">Por forma de pago</h2>${bars(porMetodo)}</div>
      <div class="panel"><h2 class="h2">Autos por empleado</h2>${bars(porEmp, n => n)}</div>
    </div>
    <div class="panel"><h2 class="h2">Servicios más vendidos</h2>${bars(porServ)}</div>
    ${anuladas.length ? `<div class="panel"><h2 class="h2">Órdenes anuladas (${anuladas.length})</h2>${anuladas.map(o => `<p class="small" style="margin:6px 0">#${o.num} · ${h(o.chapa)} · ${gs(o.total)} · <b>${h(o.motivo || '')}</b> <span class="muted">— ${h(o.canceladoPor || '')}, ${fmtFH(o.canceladoEn || o.creado)}</span>${o.pagado ? ' <span class="tag late">había pagado</span>' : ''}</p>`).join('')}</div>` : ''}`;
}

  const s = id ? D().servicios.find(x => x.id === id) : {nombre:'', precios:{auto:0, suv:0, moto:0}, activo:true};
  modal(`${sheetHead(id ? 'Editar servicio' : 'Nuevo servicio')}
    <label class="lbl">Nombre</label><input id="es-n" class="in" maxlength="60" value="${h(s.nombre)}" placeholder="Ej: Lavado de tapizados" autofocus>
    <div class="row3">${Object.entries(TIPOS).map(([k, t]) => `<div><label class="lbl">${t} (Gs.)</label><input id="es-${k}" class="in" type="number" inputmode="numeric" min="0" step="1000" value="${s.precios[k] || 0}"></div>`).join('')}</div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="es-a" ${s.activo ? 'checked' : ''} style="width:20px;height:20px"> Visible para los empleados</label>
    <div class="acts"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-ink" onclick="guardarServicio('${id || ''}')">Guardar</button></div>`);
}
async function guardarServicio(id){
  const n = $('#es-n').value.trim(); if(!n) return toast(ERRORES.FALTA_NOMBRE);
  const precios = {}; Object.keys(TIPOS).forEach(k => precios[k] = Math.max(0, Math.round(Number($('#es-' + k).value) || 0)));
  if(!Object.values(precios).some(Boolean)) return toast(ERRORES.SIN_PRECIO);
  if(await ACT.guardarServicio(id || null, {nombre:n, precios, activo:$('#es-a').checked})) closeModal();
}
function admEmpleados(){
  const d = D();
  return `<div class="board-head"><h1 class="h1">Personal y PIN</h1><button class="btn btn-ink" onclick="editEmpleado()">${ic('plus', 18)} Nueva persona</button></div>
  <p class="muted" style="margin-top:-6px">Cada uno entra con su PIN de 4 números. Así queda registrado quién recibió, lavó y cobró cada auto.</p>
  <div class="scroll-x"><table class="tbl"><thead><tr><th>Nombre</th><th>Rol</th><th class="r">Autos lavados (30 d)</th><th>Estado</th><th></th></tr></thead><tbody>
  ${d.empleados.map(e => { const n = d.ordenes.filter(o => o.lavador === e.nombre && o.creado >= hoy0() - 29 * DAY && o.estado !== 'cancelado').length;
    return `<tr style="${e.activo ? '' : 'opacity:.5'}"><td><b>${h(e.nombre)}</b></td><td>${e.rol === 'admin' ? 'Administrador' : 'Empleado'}</td><td class="r">${n}</td><td><span class="pill ${e.activo ? 'p-activo' : 'p-suspendido'}">${e.activo ? 'Activo' : 'Inactivo'}</span></td><td class="r"><button class="btn btn-sm" onclick="editEmpleado('${e.id}')">${ic('edit', 16)} Editar</button></td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function editEmpleado(id){
  const e = id ? D().empleados.find(x => x.id === id) : {nombre:'', rol:'empleado', activo:true};
  modal(`${sheetHead(id ? 'Editar persona' : 'Nueva persona')}
    <label class="lbl">Nombre</label><input id="ee-n" class="in" maxlength="40" value="${h(e.nombre)}" autofocus>
    <label class="lbl">PIN (4 números)</label><input id="ee-p" class="in" inputmode="numeric" maxlength="4" value="" placeholder="${id ? 'Dejalo vacío para no cambiarlo' : 'Ej: 4821'}">
    <label class="lbl">Rol</label><select id="ee-r" class="in"><option value="empleado" ${e.rol === 'empleado' ? 'selected' : ''}>Empleado — tablero e ingresos</option><option value="admin" ${e.rol === 'admin' ? 'selected' : ''}>Administrador — además ve caja y ajustes</option></select>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="ee-a" ${e.activo ? 'checked' : ''} style="width:20px;height:20px"> Puede entrar al sistema</label>
    <div class="acts"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-ink" onclick="guardarEmpleado('${id || ''}')">Guardar</button></div>`);
}
async function guardarEmpleado(id){
  const n = $('#ee-n').value.trim(), p = $('#ee-p').value.trim(), rol = $('#ee-r').value, activo = $('#ee-a').checked;
  if(!n) return toast(ERRORES.FALTA_NOMBRE);
  if(p ? !/^\d{4}$/.test(p) : !id) return toast(ERRORES.PIN_INVALIDO);
  if(await ACT.guardarEmpleado(id || null, {nombre:n, pin:p, rol, activo})){
    closeModal();
    if(id && id === OP.id && (!activo || rol !== 'admin')) logout();
  }
}
function admAjustes(){
  const c = D().config, lg = logoActual(), sv = S.servicio;
  return `<h1 class="h1">Ajustes y mensajes</h1>
  <div class="panel"><h2 class="h2">Datos del lavadero</h2>
    <div class="row2"><div><label class="lbl">Nombre</label><input id="aj-n" class="in" maxlength="60" value="${h(c.nombre)}"></div><div><label class="lbl">Teléfono</label><input id="aj-t" class="in" maxlength="30" value="${h(c.telefono)}"></div></div>
    <label class="lbl">Dirección</label><input id="aj-d" class="in" maxlength="120" value="${h(c.direccion)}">
    <label class="lbl">Logo</label>
    <div class="logo-prev">${lg ? `<img src="${lg.mark}" alt="Logo actual">` : '<span class="muted">Sin logo</span>'}
      <label class="btn btn-sm">${ic('edit', 16)} Cambiar logo<input type="file" accept="image/*" hidden onchange="subirLogo(this)"></label>
      ${lg && (c.logo || S.demo) ? `<button class="btn btn-sm btn-ghost" onclick="ACT.logo(null)">Quitar</button>` : ''}
    </div>
    <p class="hint">Aparece en la barra de arriba y en la pantalla de ingreso de los empleados.</p></div>
  <div class="panel"><h2 class="h2">Mensajes de WhatsApp</h2>
    <label class="lbl">Cuando el cliente pasa a retirar</label><textarea id="aj-m1" class="in" maxlength="600">${h(c.msgRetira)}</textarea>
    <label class="lbl">Cuando se lo llevamos (delivery)</label><textarea id="aj-m2" class="in" maxlength="600">${h(c.msgDelivery)}</textarea>
    <p class="hint">Se reemplazan solos: <code>{cliente}</code> <code>{vehiculo}</code> <code>{chapa}</code> <code>{total}</code> <code>{lavadero}</code> <code>{direccion}</code></p></div>
  <div class="panel"><h2 class="h2">Suscripción a OrbePy</h2>${sv ? `<dl class="kv">${sv.prueba ? '<dt>Estado</dt><dd>Período de prueba</dd>' : `<dt>Vence</dt><dd>${sv.vence ? fmtF(sv.vence) : '—'}</dd><dt>Días de gracia</dt><dd>${sv.gracia}</dd>`}</dl>` : '<p class="muted">Sin datos.</p>'}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-sun btn-lg" onclick="guardarAjustes()">${ic('check')} Guardar cambios</button>
  ${S.demo ? `<button class="btn btn-ghost" onclick="demo.reiniciar()">Reiniciar la demostración</button>` : ''}</div>`;
}
async function guardarAjustes(){
  const n = $('#aj-n').value.trim(); if(!n) return toast('Falta el nombre del lavadero');
  const c = D().config;
  if(await ACT.ajustes({nombre:n, telefono:$('#aj-t').value.trim(), direccion:$('#aj-d').value.trim(), msgRetira:$('#aj-m1').value.trim() || c.msgRetira, msgDelivery:$('#aj-m2').value.trim() || c.msgDelivery})) render();
}

/* ---------- arranque ---------- */
setInterval(() => { if(!$('#modal').innerHTML && ui.view === 'tablero' && me()) renderSeguro(); }, 30000);
if(MODO_DEMO){ S = demo.cargar(); render(); }
else {
  S.config.nombre = lsGet('lav.nombre.' + CLUB) || '';
  render(); nube.iniciar();
  setInterval(() => nube.revisarServicio(), 20 * 60000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) nube.revisarServicio(); });
  window.addEventListener('online', () => nube.revisarServicio());
}

</script>
</body>
</html>
